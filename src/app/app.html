<h1>Gestione interventi</h1>
<p>Totale: {{ interventi.length }}</p>

<app-intervento-form 
[(cliente)]="nuovoCliente"
  [(descrizione)]="nuovoDescrizione"
  [(tecnico)]="nuovoTecnico"
  [inModifica]="idInModifica !== null"
  [errore]="errore"
  (salva)="salvaIntervento()"
  (annulla)="annullaModifica()"
/>

<app-intervento-filtro-stato
  [(filtroStato)]="filtroStato"
  [visualizzati]="interventiFiltrati().length"
  [totale]="interventi.length"
/>


@for (intervento of interventiFiltrati(); track intervento.id) {
  <article>
    <app-intervento-card
    [intervento]="intervento"
    (completa)="completaIntervento($event)"
    (modifica)="modificaIntervento($event)"
    (elimina)="eliminaIntervento($event)"
    />

<!-- A sinistra, [intervento] è il nome dell’input dichiarato nel figlio
 A destra, "intervento" è l’oggetto corrente del ciclo @for nel padre-->

  <!-- Le parentesi tonde ( ) ascoltano un evento del figlio:
   (completa) è l’evento dichiarato nel figlio
   completaIntervento(...) è il metodo del padre da eseguire.-->

<!--$event contiene il valore inviato dal figlio,
 quindi in questo caso l’ID numerico-->

    @if (intervento.stato === 'Completato') {
      <p>✅ Intervento completato.</p>
    }
  </article>
} @empty {
  <p>Nessun intervento da visualizzare con questo filtro..</p>
}

<!--{{ cliente }} significa: mostra qui il valore della proprietà cliente
  definita in app.ts. Lo stesso vale per le altre due proprietà.-->

<!--Il signal aggiunge un meccanismo esplicito per comunicare il cambiamento
 e gestire i valori che ne dipendono. -->
