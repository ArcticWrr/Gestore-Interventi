<label for="form-cliente">Nome del cliente</label>
<input
  id="form-cliente"
  type="text"
  [ngModel]="cliente()"
  (ngModelChange)="cliente.set($event)"
  [disabled]="salvataggio()"
>

<label for="form-descrizione">Descrizione</label>
<input
  id="form-descrizione"
  type="text"
  [ngModel]="descrizione()"
  (ngModelChange)="descrizione.set($event)"
  [disabled]="salvataggio()"
>

<label for="form-tecnico">Tecnico</label>
<input
  id="form-tecnico"
  type="text"
  [ngModel]="tecnico()"
  (ngModelChange)="tecnico.set($event)"
  [disabled]="salvataggio()"
>
@if (!inModifica()) {
  <label for="form-data-intervento">Data intervento</label>
  <input
    id="form-data-intervento"
    type="date"
    [ngModel]="dataIntervento()"
    (ngModelChange)="dataIntervento.set($event)"
    [disabled]="salvataggio()"
  >
}

<label for="form-note">Note</label>
<textarea
  id="form-note"
  [ngModel]="note()"
  (ngModelChange)="note.set($event)"
  [disabled]="salvataggio()" 
></textarea>

<button type="button" [disabled]="salvataggio()" (click)="salva.emit()">
  @if (salvataggio()) {
    Salvataggio...
  } @else {
    {{ inModifica()
      ? 'Salva modifiche'
      : 'Aggiungi intervento'
    }}
  }
</button>

@if (inModifica()) {
  <button type="button" [disabled]="salvataggio()" (click)="annulla.emit()">
    Annulla
  </button>
}

@if (errore()) {
  <p role="alert">{{ errore() }}</p>
}
