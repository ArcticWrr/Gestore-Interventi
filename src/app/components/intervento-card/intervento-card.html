<h2>{{ intervento().cliente }}</h2>
<p>{{ intervento().descrizione }}</p>
<p>Stato: <strong>{{ intervento().stato }}</strong></p>
<p>Tecnico: {{ intervento().tecnico }}</p>

@if (intervento().stato === 'Da svolgere') {
  <button
    type="button"
    (click)="avvia.emit(intervento().id)"
  >
    Avvia intervento
  </button>
}

@if (intervento().stato === 'In corso') {
  <button
    type="button"
    (click)="completa.emit(intervento().id)"
  >
    Completa intervento
  </button>
}

<button type="button" (click)="elimina.emit(intervento().id)">
    Elimina intervento
</button>

<button type="button" (click)="modifica.emit(intervento().id)">
  Modifica
</button>
